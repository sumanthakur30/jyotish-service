spring.application.name=jyotish-service
server.port=${SERVER_PORT:8097}

spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_jyotish

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]

# Entitlement gates. Local profile disables; enable when FEATURE_JYOTISH is catalogued.
jyotish.entitlement.enabled=${JYOTISH_ENTITLEMENT_ENABLED:false}
jyotish.entitlement.base-url=${JYOTISH_SUBSCRIPTION_BASE_URL:http://localhost:8182}
jyotish.entitlement.flag=FEATURE_JYOTISH
jyotish.entitlement.fail-open=${JYOTISH_ENTITLEMENT_FAIL_OPEN:false}

# Calculation engine version stamped on snapshots (Phase 4 Dasha → V1.2).
jyotish.engine.version=${JYOTISH_ENGINE_VERSION:V1.2}
