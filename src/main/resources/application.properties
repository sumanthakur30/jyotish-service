spring.application.name=jyotish-service
server.port=${SERVER_PORT:8097}

spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_jyotish

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]

# Entitlement gates. Local default false so pilot/dev keeps working without subscription-service.
jyotish.entitlement.enabled=${JYOTISH_ENTITLEMENT_ENABLED:false}
jyotish.entitlement.base-url=${JYOTISH_SUBSCRIPTION_BASE_URL:http://localhost:8182}
jyotish.entitlement.flag=FEATURE_JYOTISH
jyotish.entitlement.matching-flag=FEATURE_JYOTISH_MATCHING
jyotish.entitlement.reports-flag=FEATURE_JYOTISH_REPORTS
jyotish.entitlement.ai-flag=FEATURE_JYOTISH_AI
jyotish.entitlement.fail-open=${JYOTISH_ENTITLEMENT_FAIL_OPEN:false}

# Calculation engine version stamped on snapshots (Panchang → V1.6).
jyotish.engine.version=${JYOTISH_ENGINE_VERSION:V1.6}

# Ephemeris provider: MEEUS (default, pure Java) or SWISS (Thomas Mack JAR — see third_party/swiss-ephemeris).
jyotish.ephemeris.provider=${JYOTISH_EPHEMERIS_PROVIDER:MEEUS}
jyotish.ephemeris.swiss-jar-path=${JYOTISH_SWISS_JAR_PATH:}
jyotish.ephemeris.swiss-ephe-path=${JYOTISH_SWISS_EPHE_PATH:}
jyotish.ephemeris.swiss-use-files=${JYOTISH_SWISS_USE_FILES:false}
jyotish.ephemeris.swiss-true-node=${JYOTISH_SWISS_TRUE_NODE:false}

# Phase 8: generated PDF files (metadata in kundali_report; bytes on disk).
jyotish.reports.storage-dir=${JYOTISH_REPORTS_DIR:./data/reports}

# Phase 10 AI assistant — default HEURISTIC (no remote call). HTTP optional.
# SaaS gate: FEATURE_JYOTISH_AI via jyotish.entitlement.ai-flag when entitlement.enabled=true.
jyotish.ai.provider=${JYOTISH_AI_PROVIDER:HEURISTIC}
jyotish.ai.http-url=${JYOTISH_AI_HTTP_URL:}
jyotish.ai.model-code=${JYOTISH_AI_MODEL_CODE:HEURISTIC_V1}
jyotish.ai.entitlement-flag=FEATURE_JYOTISH_AI
