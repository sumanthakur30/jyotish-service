# Force IANA Asia/Kolkata on the JDBC session (Windows JVMs often default to Asia/Calcutta).
spring.datasource.url=${JYOTISH_DB_URL:jdbc:postgresql://localhost:5432/jyotishdb?TimeZone=Asia/Kolkata}
spring.datasource.username=${JYOTISH_DB_USERNAME:jyotishdb}
spring.datasource.password=${JYOTISH_DB_PASSWORD:jyotishdb}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jyotish.entitlement.enabled=false

# Phase 10: keep local AI on heuristic (no remote LLM).
jyotish.ai.provider=HEURISTIC

# Ephemeris: Swiss JAR is present locally — use Moshier for print-grade Lagna/grahas.
jyotish.ephemeris.provider=SWISS
jyotish.ephemeris.swiss-jar-path=third_party/swiss-ephemeris/swisseph-2.01.00-02.jar
jyotish.ephemeris.swiss-use-files=false

# Local: no Eureka required. Hit service on :8097 (jyotish-ui proxy / GATEWAY_JYOTISH_URI).
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:false}
